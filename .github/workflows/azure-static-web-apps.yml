name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy
    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment token exists
        shell: bash
        env:
          SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          if [ -z "$SWA_TOKEN" ]; then
            echo "AZURE_STATIC_WEB_APPS_API_TOKEN is missing"
            exit 1
          fi
          echo "AZURE_STATIC_WEB_APPS_API_TOKEN is present"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build SvelteKit app
        run: |
          cd app
          npm ci
          npm run build

      - name: Merge custom functions into SSR server output
        run: |
          SERVER="app/build/server"
          # Copy v4 function registrations (src/) and shared support files
          cp -r functions/src "$SERVER/src"
          for f in utilities.js inMemoryStore.js adminAuth.js spamKeywords.json rateLimits.json flaggedPosts.json reports.json; do
            [ -f "functions/$f" ] && cp "functions/$f" "$SERVER/" || true
          done
          # Merge @azure/data-tables and @azure/functions deps into server package.json
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync(process.argv[1], 'utf8'));
            const custom = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
            pkg.dependencies = { ...pkg.dependencies, ...(custom.dependencies || {}) };
            fs.writeFileSync(process.argv[1], JSON.stringify(pkg, null, 2));
          " "$SERVER/package.json" "functions/package.json"
          # Create combined entry point: loads sk_render (SvelteKit SSR) + custom functions
          printf 'require("./sk_render/index.js");\nrequire("./src/index.js");\n' > "$SERVER/combined-entry.js"
          # Point package.json main at the combined entry so both sk_render and custom functions register
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync(process.argv[1], 'utf8'));
            pkg.main = 'combined-entry.js';
            fs.writeFileSync(process.argv[1], JSON.stringify(pkg, null, 2));
          " "$SERVER/package.json"
          # Install merged dependencies
          (cd "$SERVER" && npm install --production)
          # Copy staticwebapp.config.json into static output so Azure picks up routing rules
          cp app/build/staticwebapp.config.json app/build/static/

      - name: Build and Deploy Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: "app/build/static"
          api_location: "app/build/server"
          output_location: ""
          skip_app_build: true

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request
    steps:
      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
